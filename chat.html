<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --chat-bg: #efeae2;
      --panel-header: #f0f2f5;
      --message-out: #d9fdd3;
      --message-in: #ffffff;
      --text-main: #111b21;
      --text-muted: #667781;
      --border-color: #e9edef;
      --primary: #008069;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      height: 95vh;
      background: #fff;
      display: flex;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    /* Main Chat Window */
    .chat-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
    }

    .chat-header {
      height: 60px;
      background: var(--panel-header);
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #9c27b0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      margin-right: 12px;
    }

    .chat-header-details {
      display: flex;
      flex-direction: column;
    }

    .chat-header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .chat-header-status {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Messages Area */
    .messages-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 65%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
    }

    .message.outgoing {
      background-color: var(--message-out);
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .message-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .status-icon {
      font-weight: bold;
    }

    /* Input Area */
    .input-area {
      min-height: 62px;
      background: var(--panel-header);
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 10px;
    }

    .input-area input[type="text"] {
      flex: 1;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 15px;
      outline: none;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-radius: 50%;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .btn-send {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-send:hover {
      background-color: #006e5a;
    }

    #image-input {
      display: none;
    }

    .message-image {
      max-width: 100%;
      max-height: 250px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Chat Window -->
  <div class="chat-window">
    <div class="chat-header">
      <div class="avatar">BA</div>
      <div class="chat-header-details">
        <span class="chat-header-title">Blank Account</span>
        <span class="chat-header-status">Offline</span>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="messages-area" id="messages-area">
      <!-- Sent messages will render here -->
    </div>

    <!-- Input Bar -->
    <div class="input-area">
      <label for="image-input" class="btn" title="Attach Image">
        📎
      </label>
      <input type="file" id="image-input" accept="image/*">
      
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
      
      <button class="btn btn-send" id="send-btn" title="Send">
        ➤
      </button>
    </div>
  </div>
</div>

<script>
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const imageInput = document.getElementById('image-input');
  const messagesArea = document.getElementById('messages-area');

  function getCurrentTime() {
    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(content, type = 'text') {
    const time = getCurrentTime();
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', 'outgoing');

    let bodyContent = '';
    if (type === 'text') {
      bodyContent = `<div>${escapeHtml(content)}</div>`;
    } else if (type === 'image') {
      bodyContent = `<img src="${content}" class="message-image" alt="Uploaded image" />`;
    }

    msgDiv.innerHTML = `
      ${bodyContent}
      <div class="message-meta">
        <span>${time}</span>
        <span class="status-icon">✓</span>
      </div>
    `;

    messagesArea.appendChild(msgDiv);
    scrollToBottom();

    // Simulate delivery indicator
    const statusIcon = msgDiv.querySelector('.status-icon');
    setTimeout(() => {
      if (statusIcon) statusIcon.textContent = '✓✓';
    }, 1000);
  }

  function handleSend() {
    const text = messageInput.value.trim();
    if (text !== '') {
      appendMessage(text, 'text');
      messageInput.value = '';
    }
  }

  // Handle Enter keypress
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      handleSend();
    }
  });

  // Handle Send button click
  sendBtn.addEventListener('click', handleSend);

  // Handle image attachment
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        appendMessage(evt.target.result, 'image');
      };
      reader.readAsDataURL(file);
      imageInput.value = '';
    }
  });

  function scrollToBottom() {
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }
</script>

</body>
</html>
