<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --chat-bg: #efeae2;
      --panel-header: #f0f2f5;
      --message-out: #d9fdd3;
      --message-in: #ffffff;
      --text-main: #111b21;
      --text-muted: #667781;
      --border-color: #e9edef;
      --primary: #008069;
      --danger: #ea4335;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      height: 95vh;
      background: #fff;
      display: flex;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    /* Main Chat Window */
    .chat-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
      position: relative; /* Container context for floating elements */
    }

    .chat-header {
      height: 60px;
      background: var(--panel-header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 2;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #9c27b0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      margin-right: 12px;
    }

    .chat-header-details {
      display: flex;
      flex-direction: column;
    }

    .chat-header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .chat-header-status {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Messages Area */
    .messages-area {
      flex: 1;
      padding: 20px 20px 90px 20px; /* Extra bottom padding so messages aren't obscured by floating bar */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 65%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
    }

    .message.outgoing {
      background-color: var(--message-out);
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .message-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .status-icon {
      font-weight: bold;
    }

    /* Floating Input Area */
    .input-area {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 800px;
      height: 56px;
      background: #ffffff;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 10px;
      border-radius: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      border: 1px solid var(--border-color);
      z-index: 10;
    }

    .input-area input[type="text"] {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      padding: 0 8px;
      font-size: 15px;
      outline: none;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-radius: 50%;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .btn-send {
      background-color: var(--primary);
      color: #fff;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .btn-send:hover {
      background-color: #006e5a;
    }

    .btn-clear {
      font-size: 12px;
      color: var(--danger);
      border-radius: 4px;
      padding: 6px 10px;
      border: 1px solid var(--danger);
    }

    .btn-clear:hover {
      background-color: rgba(234, 67, 53, 0.1);
    }

    #image-input {
      display: none;
    }

    .message-image {
      max-width: 100%;
      max-height: 250px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Chat Window -->
  <div class="chat-window">
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="avatar">BA</div>
        <div class="chat-header-details">
          <span class="chat-header-title">Blank Account</span>
          <span class="chat-header-status">Offline</span>
        </div>
      </div>
      <button class="btn btn-clear" id="clear-btn" title="Clear Chat History">Clear Chat</button>
    </div>

    <!-- Messages Container -->
    <div class="messages-area" id="messages-area">
      <!-- Sent messages will render here -->
    </div>

    <!-- Floating Input Bar -->
    <div class="input-area">
      <label for="image-input" class="btn" title="Attach Image">
        📎
      </label>
      <input type="file" id="image-input" accept="image/*">
      
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
      
      <button class="btn btn-send" id="send-btn" title="Send">
        ➤
      </button>
    </div>
  </div>
</div>

<script>
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const imageInput = document.getElementById('image-input');
  const clearBtn = document.getElementById('clear-btn');
  const messagesArea = document.getElementById('messages-area');

  const STORAGE_KEY = 'chat_messages_history';

  // Load saved messages on page load
  document.addEventListener('DOMContentLoaded', loadMessages);

  function getCurrentTime() {
    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function getSavedMessages() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  }

  function saveMessageToStorage(messageObj) {
    const messages = getSavedMessages();
    messages.push(messageObj);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
  }

  function renderMessageDOM(msgData) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', 'outgoing');

    let bodyContent = '';
    if (msgData.type === 'text') {
      bodyContent = `<div>${escapeHtml(msgData.content)}</div>`;
    } else if (msgData.type === 'image') {
      bodyContent = `<img src="${msgData.content}" class="message-image" alt="Uploaded image" />`;
    }

    msgDiv.innerHTML = `
      ${bodyContent}
      <div class="message-meta">
        <span>${msgData.time}</span>
        <span class="status-icon">${msgData.status}</span>
      </div>
    `;

    messagesArea.appendChild(msgDiv);
    return msgDiv;
  }

  function loadMessages() {
    messagesArea.innerHTML = '';
    const messages = getSavedMessages();
    messages.forEach(msgData => {
      renderMessageDOM(msgData);
    });
    scrollToBottom();
  }

  function appendMessage(content, type = 'text') {
    const messageObj = {
      id: Date.now(),
      content: content,
      type: type,
      time: getCurrentTime(),
      status: '✓'
    };

    const msgDiv = renderMessageDOM(messageObj);
    saveMessageToStorage(messageObj);
    scrollToBottom();

    setTimeout(() => {
      messageObj.status = '✓✓';
      const statusIcon = msgDiv.querySelector('.status-icon');
      if (statusIcon) statusIcon.textContent = '✓✓';

      const messages = getSavedMessages();
      const targetIndex = messages.findIndex(m => m.id === messageObj.id);
      if (targetIndex !== -1) {
        messages[targetIndex].status = '✓✓';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
      }
    }, 1000);
  }

  function handleSend() {
    const text = messageInput.value.trim();
    if (text !== '') {
      appendMessage(text, 'text');
      messageInput.value = '';
    }
  }

  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      handleSend();
    }
  });

  sendBtn.addEventListener('click', handleSend);

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        appendMessage(evt.target.result, 'image');
      };
      reader.readAsDataURL(file);
      imageInput.value = '';
    }
  });

  clearBtn.addEventListener('click', () => {
    if (confirm('Are you sure you want to clear all stored chat messages?')) {
      localStorage.removeItem(STORAGE_KEY);
      messagesArea.innerHTML = '';
    }
  });

  function scrollToBottom() {
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }
</script>

</body>
</html>
